services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./server
    container_name: docmind-backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_SSL: "false"
    env_file:
      - ./server/.env
    depends_on:
      - chromadb
    restart: unless-stopped

volumes:
  chroma_data:
    external: true
    name: chroma_data
